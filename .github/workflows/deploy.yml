name: Deploy dnyftech

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Backend → Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker
        run: |
          set -euo pipefail

          echo "Checking Worker source..."

          test -f backend/src/worker.js
          node --check backend/src/worker.js

          echo "Worker source validation passed."

      - name: Deploy Worker
        run: |
          set -euo pipefail

          echo "Deploying DNYFTECH API Worker..."

          response="$(
            curl --fail-with-body -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/api" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -F 'metadata={"body_part":"script","bindings":[]};type=application/json' \
              -F 'script=@backend/src/worker.js;type=application/javascript'
          )"

          echo "$response"

          echo "$response" | grep -q '"success":true'

          echo "Cloudflare accepted the Worker deployment."

      - name: Verify Production API
        run: |
          set -euo pipefail

          echo "Waiting for Worker propagation..."
          sleep 5

          echo "Checking production health endpoint..."

          response="$(
            curl --fail-with-body -sS \
              --connect-timeout 10 \
              --max-time 30 \
              "https://api.dnyftech.workers.dev/api/health"
          )"

          echo "$response"

          echo "$response" | grep -q '"success":true'
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"version":"2.0.0"'

          echo "DNYFTECH API production verification passed."

  deploy-pages:
    name: Frontend → Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: dnyftech
          directory: frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
